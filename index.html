    <!-- تعريف قاعدة المسار لـ GitHub Pages -->
    <base href="/the-fit-journey-hub/" />
    
    <script type="text/javascript">
      // هذا الكود سيمكن التطبيق من العمل على GitHub Pages
      (function() {
        const { pathname } = window.location;
        if (!window.location.hash && pathname !== '/' && !pathname.includes('/index.html')) {
          window.location.replace(
            window.location.protocol + '//' + window.location.hostname + 
            (window.location.port ? ':' + window.location.port : '') + 
            window.location.pathname.split('/').slice(0, -1).join('/') + '/#' + pathname
          );
        }
      })();
    </script>
